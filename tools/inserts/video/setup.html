<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#20242b;overflow:hidden;font-family:DejaVu Sans,Arial,sans-serif}
#leg{position:absolute;left:36px;top:28px;color:#fff;text-shadow:0 2px 6px #000}
#tit{font-size:30px;font-weight:700}#sub{font-size:22px;margin-top:6px;color:#ffd27a;min-height:28px}
#pe{position:absolute;right:30px;bottom:22px;color:#9aa3ad;font-size:15px}
</style></head><body><div id="leg"><div id="tit"></div><div id="sub"></div></div>
<div id="pe">Robinson Crusoe — setup a partir do insert</div>
<script type="module">
import * as THREE from './three.js';
const W=1280,H=720;
const ren=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});ren.setSize(W,H);ren.setPixelRatio(1);
ren.shadowMap.enabled=false;document.body.appendChild(ren.domElement);
const sc=new THREE.Scene();sc.background=new THREE.Color('#20242b');
const cam=new THREE.PerspectiveCamera(32,W/H,10,12000);cam.up.set(0,0,1);
sc.add(new THREE.HemisphereLight(0xffffff,0x40434a,1.1));
const dl=new THREE.DirectionalLight(0xffffff,1.4);dl.position.set(-300,-500,900);sc.add(dl);
const dl2=new THREE.DirectionalLight(0xffffff,0.5);dl2.position.set(600,300,400);sc.add(dl2);
const dados=await (await fetch('cena.json')).json();const SET=await (await fetch('setup.json')).json();const [CXo,CYo]=SET.caixa;
const [BX,BY,BZ]=dados.caixa, OFF=(BX-dados.ocup)/2;
// mesa e caixa
const mesa=new THREE.Mesh(new THREE.PlaneGeometry(9000,8000),new THREE.MeshLambertMaterial({color:'#5a3f2c'}));mesa.position.set(0,150,-3.5);sc.add(mesa);
const papel=new THREE.MeshLambertMaterial({color:'#e9e4d8'});const papel2=new THREE.MeshLambertMaterial({color:'#cfc6b2',transparent:true,opacity:0.35});
const T=2.5;
function caixa(x,y,z,w,d,h,mat){const m=new THREE.Mesh(new THREE.BoxGeometry(w,d,h),mat);m.position.set(CXo+x+w/2,CYo+y+d/2,z+h/2);sc.add(m);return m;}
caixa(-OFF-T,-OFF-T,-T,BX+2*T,BY+2*T,T,papel);
caixa(-OFF-T,-OFF-T,0,T,BY+2*T,BZ,papel);caixa(BX-OFF,-OFF-T,0,T,BY+2*T,BZ,papel);
caixa(-OFF,BY-OFF,0,BX,T,BZ,papel);caixa(-OFF,-OFF-T,0,BX,T,BZ,papel2); // parede da frente translúcida
// objetos
const grupos=[];const mapa={};
for(const o of dados.objs){
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(o.v,3));g.setIndex(o.f);g.computeVertexNormals();
  const mat=new THREE.MeshLambertMaterial({color:o.cor,transparent:false,opacity:1});
  const m=new THREE.Mesh(g,mat);m.position.set(CXo,CYo,0);sc.add(m);
  const base=o.nome.split(':')[0].replace(/-tampa$/,'');
  if(!(base in mapa)){mapa[base]={base,meshes:[],rotulo:o.rotulo,passo:o.passo};grupos.push(mapa[base]);}
  mapa[base].meshes.push(m);if(o.rotulo&&!mapa[base].rotulo)mapa[base].rotulo=o.rotulo;
}
// tabuleiro que desdobra
const cv=document.createElement('canvas');cv.width=720;cv.height=520;const cx2=cv.getContext('2d');
const Y=y=>520-y; // mm do tabuleiro -> pixel do canvas
cx2.fillStyle='#e3d3a4';cx2.fillRect(0,0,720,520);
cx2.fillStyle='#8a5a32';cx2.fillRect(0,Y(133),720,133);                       // faixa de madeira (ações)
cx2.fillStyle='#a9c98c';cx2.beginPath();cx2.moveTo(60,Y(420));cx2.lineTo(300,Y(430));cx2.lineTo(380,Y(260));cx2.lineTo(330,Y(160));cx2.lineTo(80,Y(170));cx2.lineTo(30,Y(300));cx2.closePath();cx2.fill();
cx2.strokeStyle='#b03030';cx2.lineWidth=3;cx2.stroke();                       // ilha
cx2.strokeStyle='#5a3a1a';cx2.lineWidth=3;
const esp=(x0,x1,y0,y1,t)=>{cx2.strokeRect(x0,Y(y1),x1-x0,y1-y0);cx2.fillStyle='#3a2410';cx2.font='bold 13px DejaVu Sans';cx2.fillText(t,x0+3,Y(y1)-4);};
esp(82,143,399,494,'EVENTOS');
cx2.strokeStyle='#f3e2b8';cx2.fillStyle='#f3e2b8';
for(const [cx,t] of [[220,'CAÇADA'],[292,'CONSTRUIR'],[394,'COLETAR'],[484,'EXPLORAR']]){cx2.strokeRect(cx-32,Y(118),64,96);cx2.font='bold 12px DejaVu Sans';cx2.fillText(t,cx-30,Y(6));}
cx2.strokeRect(20,Y(118),150,96);cx2.fillText('AMEAÇAS',24,Y(6));
cx2.strokeStyle='#5a3a1a';
for(let i=0;i<5;i++)cx2.strokeRect(445+i*52,Y(400),44,60); for(let i=0;i<4;i++)cx2.strokeRect(445+i*52,Y(320),44,60);
cx2.fillStyle='#5a3a1a';cx2.font='bold 14px DejaVu Sans';cx2.fillText('INVENÇÕES',520,Y(250));cx2.fillText('MORAL',180,Y(470));
cx2.font='bold 30px DejaVu Sans';cx2.fillText('TABULEIRO',470,Y(475));
const tex=new THREE.CanvasTexture(cv);
const tab=new THREE.Mesh(new THREE.BoxGeometry(1,1,1),[0,0,0,0,0,0].map((_,i)=>new THREE.MeshLambertMaterial(i==4?{map:tex}:{color:'#b59a62'})));sc.add(tab);
for(const g of grupos){const al=SET.alvo[g.base]; if(!al) continue; for(const m of g.meshes){m.geometry.translate(-al.c[0],-al.c[1],-al.c[2]);}}
const ordem=grupos.slice().reverse().filter(g=>g.base!=='TABULEIRO'&&SET.alvo[g.base]);
for(const g of grupos){ if(g.base==='TABULEIRO') g.meshes.forEach(m=>m.visible=false); }
const N=ordem.length, T0=2.5, TB=2.6, DT=0.42, DUR=1.1;
const tFimMov=T0+TB+N*DT+DUR; const tFim=tFimMov+5.0; window.DURACAO=tFim;
const ease=x=>x<0?0:x>1?1:(x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2);
const ZONA=f=>(f[0]>=0&&f[0]<=720&&f[1]>=0&&f[1]<=520)?'em cima do tabuleiro, no espaço dele':
  f[1]<0?'logo abaixo do tabuleiro':f[0]<0?'ao lado do tabuleiro (esquerda)':f[1]>520?'acima do tabuleiro':'à direita do tabuleiro';
window.renderFrame=function(t){
  let tit='Abrindo a caixa',sub='';
  // tabuleiro: sai da caixa e desdobra
  const ta=ease((t-T0)/TB);
  const w=277+(720-277)*ta, d=239+(520-239)*ta, h=16+(3-16)*ta;
  const x0=CXo+156.25, y0=CYo+156.25, x1=360, y1=260;
  tab.scale.set(w,d,h);tab.position.set(x0+(x1-x0)*ta, y0+(y1-y0)*ta, (1-ta)*(100+8)+h/2+Math.sin(Math.PI*ta)*260);
  tab.visible=t>=0.0;
  if(t>=T0&&t<T0+TB){tit='Tabuleiro';sub='sai por cima e é aberto no centro da mesa';}
  ordem.forEach((g,i)=>{
    const a=ease((t-(T0+TB+i*DT))/DUR); const al=SET.alvo[g.base]; if(!al) return;
    const sx=CXo+al.c[0], sy=CYo+al.c[1], sz=al.c[2], ex=al.fim[0], ey=al.fim[1], ez=al.fim[2];
    for(const m of g.meshes){ m.position.set(sx+(ex-sx)*a, sy+(ey-sy)*a, sz+(ez-sz)*a + Math.sin(Math.PI*a)*240); m.rotation.z=al.rot*Math.PI/180*a; }
    if(t>=T0+TB+i*DT&&t<T0+TB+(i+1)*DT){tit=g.rotulo||g.base;sub=ZONA(al.fim);}
  });
  
  if(t>=tFimMov){tit='Mesa pronta para jogar';sub=t<tFimMov+2.2?'só sai da caixa o que se usa na partida':'cartas e dados em cima do tabuleiro; ao lado, só o essencial';}
  // câmera: começa na caixa e abre para a mesa toda
  const k=ease(Math.min(1,t/(T0+TB+2)));
  const k2=ease((t-tFimMov)/2.2);
  let alvoX=CXo+156+(200-(CXo+156))*k, alvoY=CYo+156+(250-(CYo+156))*k;
  let R=650+900*k, Z=560+1050*k;
  alvoX+= (380-alvoX)*k2; alvoY+=(150-alvoY)*k2; R+=(1150-R)*k2; Z+=(1300-Z)*k2;
  const ang=-1.4+0.08*Math.sin(t*0.25);
  cam.position.set(alvoX+R*Math.cos(ang)*0.45, alvoY+R*Math.sin(ang), Z);cam.lookAt(alvoX,alvoY,0);
  document.getElementById('tit').textContent=tit;document.getElementById('sub').textContent=sub;
  ren.render(sc,cam);
};
window.pronto=true;
</script></body></html>
