<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#20242b;overflow:hidden;font-family:DejaVu Sans,Arial,sans-serif}
#leg{position:absolute;left:36px;top:28px;color:#fff;text-shadow:0 2px 6px #000}
#tit{font-size:30px;font-weight:700}#sub{font-size:22px;margin-top:6px;color:#ffd27a;min-height:28px}
#pe{position:absolute;right:30px;bottom:22px;color:#9aa3ad;font-size:15px}
</style></head><body><div id="leg"><div id="tit"></div><div id="sub"></div></div>
<div id="pe">Robinson Crusoe — insert (Conclave + Everything New)</div>
<script type="module">
import * as THREE from './three.js';
const W=1280,H=720;
const ren=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});ren.setSize(W,H);ren.setPixelRatio(1);
ren.shadowMap.enabled=false;document.body.appendChild(ren.domElement);
const sc=new THREE.Scene();sc.background=new THREE.Color('#20242b');
const cam=new THREE.PerspectiveCamera(32,W/H,10,5000);cam.up.set(0,0,1);
sc.add(new THREE.HemisphereLight(0xffffff,0x40434a,1.1));
const dl=new THREE.DirectionalLight(0xffffff,1.4);dl.position.set(-300,-500,900);sc.add(dl);
const dl2=new THREE.DirectionalLight(0xffffff,0.5);dl2.position.set(600,300,400);sc.add(dl2);
const dados=await (await fetch('cena.json')).json();
const [BX,BY,BZ]=dados.caixa, OFF=(BX-dados.ocup)/2;
// mesa e caixa
const mesa=new THREE.Mesh(new THREE.PlaneGeometry(3000,3000),new THREE.MeshLambertMaterial({color:'#3a3f47'}));mesa.position.set(150,150,-3.5);sc.add(mesa);
const papel=new THREE.MeshLambertMaterial({color:'#e9e4d8'});const papel2=new THREE.MeshLambertMaterial({color:'#cfc6b2',transparent:true,opacity:0.35});
const T=2.5;
function caixa(x,y,z,w,d,h,mat){const m=new THREE.Mesh(new THREE.BoxGeometry(w,d,h),mat);m.position.set(x+w/2,y+d/2,z+h/2);sc.add(m);return m;}
caixa(-OFF-T,-OFF-T,-T,BX+2*T,BY+2*T,T,papel);
caixa(-OFF-T,-OFF-T,0,T,BY+2*T,BZ,papel);caixa(BX-OFF,-OFF-T,0,T,BY+2*T,BZ,papel);
caixa(-OFF,BY-OFF,0,BX,T,BZ,papel);caixa(-OFF,-OFF-T,0,BX,T,BZ,papel2); // parede da frente translúcida
// objetos
const grupos=[];const mapa={};
for(const o of dados.objs){
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(o.v,3));g.setIndex(o.f);g.computeVertexNormals();
  const mat=new THREE.MeshLambertMaterial({color:o.cor,transparent:false,opacity:1});
  const m=new THREE.Mesh(g,mat);m.position.set(-OFF*0+0,0,0);sc.add(m);
  const base=o.nome.split(':')[0].replace(/-tampa$/,'');
  if(!(base in mapa)){mapa[base]={meshes:[],rotulo:o.rotulo,passo:o.passo};grupos.push(mapa[base]);}
  mapa[base].meshes.push(m);if(o.rotulo&&!mapa[base].rotulo)mapa[base].rotulo=o.rotulo;
}
const PASSOS={1:'1. Fundo da caixa',2:'2. Segundo andar',3:'3. Bandeja do vulcão',4:'4. Camada de cima',5:'5. Tabuleiro, fichas, manual e guias'};
const N=grupos.length, DT=0.55, DUR=0.8, T0=1.5, TH=2.8, DT2=0.32, DUR2=0.7;
const tMontado=T0+N*DT+DUR, tDes=tMontado+TH, tFim=tDes+N*DT2+DUR2+1.2;
window.DURACAO=tFim;
const ease=x=>x<0?0:x>1?1:1-Math.pow(1-x,3), easeIn=x=>x<0?0:x>1?1:x*x;
window.renderFrame=function(t){
  let tit='Caixa vazia',sub='';
  grupos.forEach((g,i)=>{
    const a=ease((t-(T0+i*DT))/DUR);
    const j=N-1-i;const b=easeIn((t-(tDes+j*DT2))/DUR2);
    for(const m of g.meshes){
      const z=(1-a)*220 + b*260, x=b*480;
      m.position.set(x,0,z);m.visible=a>0&&b<1;const op=a<1?Math.min(1,a*1.6):(1-b);m.material.opacity=op;m.material.transparent=op<0.999;
    }
    if(t>=T0+i*DT&&t<T0+i*DT+DT+0.2&&t<tMontado){tit=PASSOS[g.passo]||'';sub=g.rotulo||'';}
  });
  if(t>=tMontado&&t<tDes){tit='Montado — a tampa fecha';sub='Insert 312,5 × 312,5 × 100 mm';}
  if(t>=tDes&&t<tFim-1.0){tit='Desmontando para jogar';const k=Math.min(N-1,Math.floor((t-tDes)/DT2));const g=grupos[N-1-k];sub=g?g.rotulo||'':'';}
  if(t>=tFim-1.0){tit='Pronto para jogar';sub='tudo saiu da caixa direto para a mesa';}
  document.getElementById('tit').textContent=tit;document.getElementById('sub').textContent=sub;
  const ang=-0.95+0.25*Math.sin(t/tFim*Math.PI*2)+ (t/tFim)*0.35;
  const R=640, cxp=156, cyp=156;
  cam.position.set(cxp+R*Math.cos(ang), cyp+R*Math.sin(ang), 560);cam.lookAt(cxp+30,cyp+10,30);
  ren.render(sc,cam);
};
window.pronto=true;
</script></body></html>
